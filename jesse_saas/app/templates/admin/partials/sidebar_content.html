<!-- Main Nav -->
<div class="px-2">
    <h3 class="px-4 text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Platform Control</h3>
    <div class="space-y-1.5">
        <a href="{{ url_for('admin.dashboard') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'dashboard' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            Dashboard
        </a>
        <a href="{{ url_for('admin.clients_list') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'clients' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            Clients
        </a>
        <a href="{{ url_for('admin.system_logs') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'logs' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            System Health
        </a>
    </div>
</div>

<!-- Analytics Studio -->
<!-- Analytics Studio (Visible only when viewing a Client) -->
{% if client %}
<div class="px-2 pt-4 mt-4 border-t border-gray-100">
    <!-- Client Context -->
    <div class="px-4 py-3 mb-6 glass-card rounded-2xl border-white hover:shadow-md transition-shadow">
        <h4 class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">Current Client</h4>
        <p class="text-sm font-black text-gray-900 truncate tracking-tight">{{ client.restaurant_name }}</p>
    </div>

    <!-- Admin Studio Section -->
    <div class="mb-8">
        <a href="{{ url_for('admin.edit_client', client_id=client.id) }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'hub' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Admin Studio
        </a>
    </div>

    <!-- Analytics Studio Section -->
    <h3 class="px-4 text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4">Analytics Studio</h3>
    <div class="space-y-1.5">
        <a href="{{ url_for('admin.client_stats', client_id=client.id, view_mode='overview') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'overview' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            Overview
        </a>
        <a href="{{ url_for('admin.client_stats', client_id=client.id, view_mode='conversations') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'conversations' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            Conversations
        </a>
        <a href="{{ url_for('admin.client_stats', client_id=client.id, view_mode='events') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'events' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
            </svg>
            Conversions
        </a>
        <a href="{{ url_for('admin.client_stats', client_id=client.id, view_mode='trends') }}"
            class="flex items-center px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group {{ 'bg-blue-600 text-white shadow-lg shadow-blue-200' if active_page == 'trends' else 'text-gray-500 hover:bg-white hover:text-blue-600 hover:shadow-sm' }}">
            <svg class="mr-3 h-5 w-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
            Trends
        </a>
    </div>
</div>
{% endif %}
